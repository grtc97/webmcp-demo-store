name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Format, test and build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out the code
              uses: actions/checkout@v4

            - name: Set up Node (version from .nvmrc)
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run tests
              run: npm test

            - name: Build the storefront and the MCP App
              run: npm run build

            - name: Check that the MCP App is one self-contained file
              run: |
                  test -f dist/mcp-app/index.html
                  test "$(find dist/mcp-app -type f | wc -l)" -eq 1
